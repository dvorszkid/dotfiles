general {
    lock_cmd = pidof hyprlock || hyprlock --grace 3         # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session                # lock before suspend.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'  # make sure the display is back on after resume.
}

listener {
    timeout = 600                           # 10min
    on-timeout = loginctl lock-session      # lock screen when timeout has passed
}

listener {
    timeout = 660                                      # 11min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")' # screen off when timeout has passed
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")'   # screen on when activity is detected after timeout has fired.
}
